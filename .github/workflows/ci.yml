name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, "release-*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/ worker/ tests/
      - run: ruff format --check api/ worker/ tests/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      COMFY_OUTPUT_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt -r worker/requirements.txt pytest
      - run: pytest tests/ -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      COMFY_OUTPUT_HOST: /tmp/comfy_output_mock
      DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/test
      COMFY_URL: http://host.docker.internal:8188
      API_KEY: dev-ci-key 
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build