# docker-compose.yml - Release 2: ComfyUI в Docker, GPU
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Preflight — скачивает модели ДО запуска ComfyUI
  preflight:
    build:
      context: ./scripts
      dockerfile: Dockerfile.preflight
    environment:
      - MODELS_MAP=/app/models_map.json
    volumes:
      - comfy_models:/opt/ComfyUI/models
      - ./scripts/models_map.json:/app/models_map.json:ro
    restart: "no"
    networks: [internal]
    # Не зависит от comfyui, выполняется первым

  # ComfyUI — запускается только после успешного завершения preflight
  comfyui:
    build: ./comfyui
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8188:8188"
    volumes:
      - comfy_models:/opt/ComfyUI/models
      - comfy_output:/opt/ComfyUI/output
    depends_on:
      preflight:
        condition: service_completed_successfully
    networks: [internal]

  api:
    build: 
      context: .
      dockerfile: ./api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      COMFY_OUTPUT_DIR: /comfy_output
      COMFY_URL: http://comfyui:8188
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - comfy_output:/comfy_output:ro
    networks: [internal]

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      COMFY_URL: http://comfyui:8188
    depends_on:
      postgres:
        condition: service_healthy
      comfyui:
        condition: service_started
    networks: [internal]

volumes:
  pg_data:
  comfy_models:
  comfy_output:

networks:
  internal:
    driver: bridge